<!DOCTYPE html>
<html>
<head>
    <title>Simple Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #000; color: #0f0; }
        button { padding: 20px; font-size: 20px; margin: 10px; }
        pre { background: #111; padding: 20px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Simple Calendar Test</h1>
    
    <button onclick="test1()">TEST 1: Check Token</button>
    <button onclick="test2()">TEST 2: Call API</button>
    
    <pre id="out">Click buttons above...</pre>
    
    <script>
    function test1() {
        let o = document.getElementById('out');
        o.innerHTML = 'Checking token...\n\n';
        
        let token = localStorage.getItem('mew_token');
        let name = localStorage.getItem('mew_name');
        
        if (token) {
            o.innerHTML += 'TOKEN EXISTS!\n';
            o.innerHTML += 'Token: ' + token.substring(0, 30) + '...\n';
            o.innerHTML += 'Name: ' + name + '\n';
            o.innerHTML += 'Length: ' + token.length + '\n';
        } else {
            o.innerHTML += 'NO TOKEN! Sign in first at /calendar\n';
        }
    }
    
    function test2() {
        let o = document.getElementById('out');
        o.innerHTML = 'Testing API...\n\n';
        
        let token = localStorage.getItem('mew_token');
        if (!token) {
            o.innerHTML += 'ERROR: No token!\n';
            return;
        }
        
        fetch('https://mew-assistant-dev.gentlehill-b3306295.westus2.azurecontainerapps.io/simple-calendar/events?max_results=5', {
            headers: { 'Authorization': 'Bearer ' + token }
        })
        .then(r => {
            o.innerHTML += 'Status: ' + r.status + '\n\n';
            return r.json();
        })
        .then(data => {
            o.innerHTML += 'Response:\n' + JSON.stringify(data, null, 2);
        })
        .catch(e => {
            o.innerHTML += 'ERROR: ' + e.message;
        });
    }
    </script>
</body>
</html>
