<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mew Assistant - OAuth Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        h1 { color: #667eea; margin-bottom: 10px; font-size: 28px; }
        p { color: #666; margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .oauth-btn { padding: 15px 25px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.3s; }
        .oauth-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .google { background: #4285f4; color: white; }
        .microsoft { background: #00a4ef; color: white; }
        .apple { background: #000; color: white; }
        .token-section { margin-top: 30px; padding-top: 30px; border-top: 2px solid #eee; }
        .token-box { background: #f5f5f5; padding: 15px; border-radius: 8px; margin-top: 10px; word-break: break-all; font-family: monospace; font-size: 12px; }
        .hidden { display: none; }
        .status { padding: 10px; border-radius: 8px; margin-top: 10px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 Mew Assistant</h1>
        <p>Test OAuth Login</p>
        
        <div class="btn-group">
            <button class="oauth-btn google" onclick="loginWith('google')">
                <span>📧</span> Continue with Google
            </button>
            <button class="oauth-btn microsoft" onclick="loginWith('microsoft')">
                <span>🏢</span> Continue with Microsoft
            </button>
            <button class="oauth-btn apple" onclick="loginWith('apple')">
                <span>🍎</span> Continue with Apple
            </button>
        </div>

        <div id="status" class="hidden"></div>

        <div class="token-section hidden" id="tokenSection">
            <h3>Access Token</h3>
            <div class="token-box" id="tokenBox"></div>
            <button class="oauth-btn" style="background: #667eea; color: white; margin-top: 15px;" onclick="testAPI()">
                Test API with Token
            </button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://mew-assistant-dev.gentlehill-b3306295.westus2.azurecontainerapps.io';
        
        function showStatus(message, isError = false) {
            const status = document.getElementById('status');
            status.className = `status ${isError ? 'error' : 'success'}`;
            status.textContent = message;
            status.classList.remove('hidden');
        }

        function loginWith(provider) {
            showStatus(`Redirecting to ${provider} login...`);
            window.location.href = `${API_BASE}/auth/login/${provider}`;
        }

        // Check if we have a code in the URL (OAuth callback)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            
            if (code) {
                // Extract provider from state or URL
                const provider = state || 'google';
                exchangeCode(code, provider);
            }
        };

        async function exchangeCode(code, provider) {
            showStatus('Exchanging authorization code for token...');
            
            try {
                const response = await fetch(`${API_BASE}/auth/federated/${provider}/callback`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('✅ Login successful!');
                    document.getElementById('tokenBox').textContent = data.access_token;
                    document.getElementById('tokenSection').classList.remove('hidden');
                    localStorage.setItem('mew_token', data.access_token);
                } else {
                    showStatus(`❌ Login failed: ${data.detail}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }

        async function testAPI() {
            const token = localStorage.getItem('mew_token');
            if (!token) {
                showStatus('No token found', true);
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/auth/me`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus(`✅ API Test Successful! User: ${data.email}`);
                } else {
                    showStatus(`❌ API Test Failed: ${data.detail}`, true);
                }
            } catch (error) {
                showStatus(`❌ Error: ${error.message}`, true);
            }
        }
    </script>
</body>
</html>
