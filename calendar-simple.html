<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; font-size: 28px; margin-bottom: 20px; text-align: center; }
        .big-button {
            display: block;
            width: 100%;
            background: #667eea;
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0;
            text-decoration: none;
            text-align: center;
        }
        .big-button:hover { background: #5568d3; }
        .event {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            border-left: 4px solid #667eea;
        }
        .event-title { font-weight: bold; margin-bottom: 5px; }
        .event-time { color: #666; font-size: 14px; }
        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 My Calendar</h1>
        
        <!-- Not signed in -->
        <div id="needSignIn" style="display:none;">
            <p style="text-align:center; margin:20px 0; color:#666; font-size:16px;">
                Click below to connect your Google Calendar
            </p>
            <a href="https://mew-assistant-dev.gentlehill-b3306295.westus2.azurecontainerapps.io/auth/simple/google" 
               class="big-button">
                🔐 Connect Google Calendar
            </a>
        </div>
        
        <!-- Signed in -->
        <div id="signedIn" style="display:none;">
            <button onclick="showCalendar()" class="big-button">
                📅 Show My Events
            </button>
        </div>
        
        <!-- Loading -->
        <div id="loading" style="display:none;" class="loading">
            Loading your calendar...
        </div>
        
        <!-- Messages -->
        <div id="message"></div>
        
        <!-- Events -->
        <div id="events"></div>
    </div>

    <script>
        const API = 'https://mew-assistant-dev.gentlehill-b3306295.westus2.azurecontainerapps.io';
        
        // Check if signed in
        window.onload = function() {
            const token = localStorage.getItem('mew_token');
            if (token) {
                document.getElementById('signedIn').style.display = 'block';
            } else {
                document.getElementById('needSignIn').style.display = 'block';
            }
        };
        
        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.className = 'message ' + type;
            msg.textContent = text;
        }
        
        function showCalendar() {
            const token = localStorage.getItem('mew_token');
            if (!token) {
                showMessage('Please connect your calendar first', 'error');
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('events').innerHTML = '';
            document.getElementById('message').innerHTML = '';
            
            fetch(API + '/simple-calendar/events?max_results=20', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(response => {
                if (!response.ok) throw new Error('Please sign in again');
                return response.json();
            })
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                
                if (data.events && data.events.length > 0) {
                    showMessage(`Found ${data.count} events`, 'success');
                    
                    const eventsDiv = document.getElementById('events');
                    data.events.forEach(event => {
                        const div = document.createElement('div');
                        div.className = 'event';
                        
                        const title = document.createElement('div');
                        title.className = 'event-title';
                        title.textContent = event.summary || 'Untitled';
                        
                        const time = document.createElement('div');
                        time.className = 'event-time';
                        const date = new Date(event.start);
                        time.textContent = date.toLocaleString();
                        
                        div.appendChild(title);
                        div.appendChild(time);
                        eventsDiv.appendChild(div);
                    });
                } else {
                    showMessage('No events found', 'success');
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                showMessage('Error: ' + error.message, 'error');
            });
        }
    </script>
</body>
</html>
