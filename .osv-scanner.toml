# OSV-Scanner ignore list for advisories that can't be resolved by bumping
# a line in requirements.txt — each requires separate, riskier dependency
# surgery on core auth/web-framework packages, tracked here rather than
# silently blocking CI or blindly weakening the whole osv_scan gate.

[[IgnoredVulns]]
id = "GHSA-wj6h-64fc-37mp"
reason = "ecdsa (transitive via python-jose): Minerva timing side-channel. No fixed version exists upstream — python-ecdsa's maintainer has declined to fix it (out of their stated threat model). Can't be resolved by a version bump."

[[IgnoredVulns]]
