name: GitFlow Workflow

on:
  push:
    branches: [ main, develop, 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      
      - name: Validate branch naming
        run: |
          # For pull requests, use GITHUB_HEAD_REF instead of GITHUB_REF
          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH=$GITHUB_HEAD_REF
          else
            BRANCH=${GITHUB_REF#refs/heads/}
          fi
          echo "Current branch: $BRANCH"
          
          if [[ "$BRANCH" =~ ^(main|develop|feature/.+|release/.+|hotfix/.+|ci/.+)$ ]]; then
            echo "✅ Valid GitFlow branch name"
          else
            echo "❌ Invalid branch name. Must follow GitFlow conventions:"
            echo "  - main, develop"
            echo "  - feature/* (for features)"
            echo "  - release/* (for releases)"
            echo "  - hotfix/* (for hotfixes)"
            echo "  - ci/* (for automated workflow branches, e.g. sync-develop.yml)"
            exit 1
          fi
