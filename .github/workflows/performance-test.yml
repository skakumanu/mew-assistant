name: Performance Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM

jobs:
  load-test:
    name: Load Testing with Locust
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: '.'
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: mew
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: mew_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust

    - name: Ensure SECRET_KEY
      run: |
        if [ -z "${{ secrets.SECRET_KEY }}" ]; then
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV
        else
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
        fi
    
    - name: Start application
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        DATABASE_URL: postgresql://mew:test_password@localhost:5432/mew_test
        
    
    - name: Run load tests
      run: |
        locust -f tests/performance/locustfile.py \
          --headless \
          --users 50 \
          --spawn-rate 5 \
          --run-time 1m \
          --host http://localhost:8000 \
          --html performance-report.html \
          --csv performance-results \
          --expect-workers 1 || true
    
    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: |
          performance-report.html
          performance-results_*.csv

  benchmark:
    name: API Benchmarking
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: '.'
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-benchmark pytest-cov
    
    - name: Run benchmark tests
      run: |
        pytest tests/performance/test_benchmarks.py \
          --benchmark-only \
          --benchmark-json=benchmark-results.json
      env:
        DATABASE_URL: sqlite:///./test-benchmark-${{ github.run_id }}.db
        SECRET_KEY: ${{ env.SECRET_KEY }}
    
    - name: Store benchmark result
      if: false  # Disabled: requires gh-pages branch setup
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: benchmark-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
