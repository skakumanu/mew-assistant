[mypy]
python_version = 3.11
ignore_missing_imports = True
# Workarounds for duplicate-module name resolution in this workspace.
# If mypy reports a source file found under multiple module names
# (e.g. "utils.logging" and "app.utils.logging"), ignore errors
# for the specific module while we keep package structure stable.
[mypy-app.utils.logging]
ignore_errors = True
