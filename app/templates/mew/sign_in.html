{% extends "mew/base.html" %}
{% block title %}{{ t.ui.sign_in }} · Mew Assistant{% endblock %}

{% block content %}
<div class="masthead">
  <div class="wordmark">
    <span class="mark" aria-hidden="true">m</span>
    <span class="eyebrow">Mew Assistant</span>
  </div>
</div>

<form class="signin" method="post" action="/app/sign-in">
  <h1 style="font-size:21px;font-weight:600">{{ t.ui.sign_in }}</h1>

  {% if error %}
  <!-- Status is never colour alone: the message carries the meaning. -->
  <p class="banner banner--waiting" role="alert">{{ t.ui.error }}</p>
  {% endif %}

  <input type="hidden" name="next" value="{{ next_path }}">

  <label for="email" class="field-label">Email</label>
  <input id="email" name="email" type="email" autocomplete="username" required>

  <label for="password" class="field-label">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <button class="btn btn--primary" type="submit">{{ t.ui.continue }}</button>
</form>
{% endblock %}
